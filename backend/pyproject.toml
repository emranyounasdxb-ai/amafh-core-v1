[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "amafh-core-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.4",
  "pydantic-settings==2.11.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "pycountry>=26.2.16",
  "python-multipart==0.0.32",
  "reportlab==5.0.1",
  "arabic-reshaper==3.0.1",
  "python-bidi==0.6.11",
  "pillow==12.3.0",
  "pypdf==6.19.0",
  "cryptography==50.0.1",
  "google-api-python-client==2.200.0",
  "google-auth==2.58.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pymupdf==1.28.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
